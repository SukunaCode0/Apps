<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Demo App</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>🚀 Demo Game</h1>
    <p>This is the <b>preview screen</b>. Replace these files with your real app/game.</p>
  </header>
  <div id="scoreCard">
    <div>Score: <span id="scoreEl">0</span></div>
    <div>Time: <span id="timeEl">30</span>s</div>
  </div>
  <div id="playEl">Tap the target!</div>
  <button id="targetBtn">🎯 TAP ME</button>
  <div id="rowBtns">
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
  </div>
  <p id="hintEl">Files: <code>src/app/index.html</code>, <code>style.css</code>, <code>app.js</code></p>
</div>
<script src="./app.js"></script>
</body>
</html>
